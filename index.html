<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunica Plus</title>

    <link rel="stylesheet" href="style.css">
    <!--OBS: defer adia o carregamento do JS, não interrompendo a leitura do HTML-->
    <script src="script.js" defer></script>
    <script src="gemini.js" defer></script>
</head>

<body>

    <!--Cabeçalho principal-->
    <header>
        <h1>Comunica Plus</h1>
        <p>Refine seus e-mails e mensagens corporativas com IA</p>
    </header>

    <!--Indicador de conteúdo principal-->
    <main>
        <!--Barra lateral - configuração-->
        <aside class="configuracoes">
            <h2>Opções</h2>
            <!--Espaço reservado para feature botões-->
            <div class="grupo-tom">
                <label for="tom-texto" class="texto-apoio">Tom de voz</label>
                <select id="tom-texto">
                    <option value="profissional">Profissional</option>
                    <option value="direto">Direto</option>
                    <option value="amigavel">Amigavel</option>
                </select>
            </div>

            <!--OBS: o ID aqui vai ser usado pelo JS enquanto o Class pelo CSS, por isso os dois-->
            <div class="actions">
                <label class="texto-apoio">Controles</label>
                <button id="btn-copiar" class="btn-secundario">Copiar texto</button>
                <button id="btn-limpar" class="btn-secundario">Limpar tudo</button>
                <button id="btn-gerar" class="btn-principal">Gerar com IA</button>
            </div>
        </aside>

        <!--Agrupa conteúdos de mesmo tema-->
        <section class="input">
            <h2>Rascunho</h2>
            <textarea id="entrada" placeholder="Digite aqui..." rows="15"></textarea>

            <div class="utilitarios">
                <span id="contador">0 caracteres</span>
                <span id="status-ia" class="status-texto"></span>
            </div>
        </section>

    </main>

</body>

</html>
