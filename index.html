<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refinamento comunicação</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--Cabeçalho principal-->
    <header>
        <h1>Comunica Plus</h1>
        <p>Refine seus e-mails e mensagens corporativas com IA</p>
    </header>

    <!--Indicador de conteúdo principal-->
    <main>
        <!--Barra lateral - configuração-->
        <aside class="configuracoes">
            <h2>Configurações</h2>
            <!--Espaço reservado para feature botões-->
            <p>Opções de tom de voz entrarão aqui.</p>
        </aside>

        <!--Agrupa conteúdos de mesmo tema-->
        <section class="input">
            <h2>Rascunho</h2>
            <textarea id="entrada" placeholder="Digite aqui..." rows="15"></textarea>
            
            <div class="utilitarios">
            <span id="contador">0 caracteres</span>
            </div>
        </section>

    </main>

    <!--Conexão com o JS-->
    <script src="script.js" defer></script>

</body>
</html>
